<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="XMarginalia">
  <title>XMarginalia</title>
  <!--
    The XMarginalia mark: a reading page and margin annotations inside four
    e-ink corner brackets ("Bracketed Note").

    Uses fill-rule="evenodd" for the page cutouts so the mark renders with a
    single ink colour (currentColor) across light, cream e-paper, and dark
    surfaces. Keep the geometry synchronized with logo-dark.svg, favicon.svg,
    src/network/html/assets/crosspoint-icon.svg, and scripts/generate_logo.py.
  -->
